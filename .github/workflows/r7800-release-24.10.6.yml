name: Build Netgear r7800 - release (24.10.6) Custom

on:
  repository_dispatch:
  workflow_dispatch:

env:
  OPENWRT_DEVICE_MODEL: netgear_r7800
  CUSTOM_LAN_IP: "10.0.0.1"
  CUSTOM_LAN_NETMASK: "255.255.255.0"
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update && sudo apt-get -qq upgrade
        sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Checkout
      uses: actions/checkout@main

    - name: Download the sources
      run: |
        git clone https://github.com/4meters/openwrt-r7800
        cd openwrt-r7800
        mkdir luci-patches
        cp -r ./feeds/luci/modules/* ./luci-patches
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp -r ./luci-patches/* ./feeds/luci/modules
        cp ./.github/.config ./.config
        # Patch default IP to 10.0.0.1
        sed -i 's/CONFIG_TARGET_PREINIT_IP="192.168.1.1"/CONFIG_TARGET_PREINIT_IP="${{ env.CUSTOM_LAN_IP }}"/' .config
        sed -i 's/CONFIG_TARGET_PREINIT_BROADCAST="192.168.1.255"/CONFIG_TARGET_PREINIT_BROADCAST="10.0.0.255"/' .config
        grep -q "CONFIG_TARGET_PREINIT_IP=" .config || echo "CONFIG_TARGET_PREINIT_IP=\"${{ env.CUSTOM_LAN_IP }}\"" >> .config
        grep -q "CONFIG_TARGET_PREINIT_BROADCAST=" .config || echo "CONFIG_TARGET_PREINIT_BROADCAST=\"10.0.0.255\"" >> .config

    - name: Inject custom uci-defaults for LAN IP 10.0.0.1
      run: |
        cd openwrt-r7800
        mkdir -p files/etc/uci-defaults
        cat > files/etc/uci-defaults/99-custom-settings << 'SCRIPT'
#!/bin/sh
uci set network.lan.ipaddr='10.0.0.1'
uci set network.lan.netmask='255.255.255.0'
uci commit network
uci set dhcp.lan.start='100'
uci set dhcp.lan.limit='150'
uci commit dhcp
exit 0
SCRIPT
        chmod +x files/etc/uci-defaults/99-custom-settings

    - name: Build the firmware image
      id: compile
      run: |
        cd openwrt-r7800
        IGNORE_ERRORS=m make -j$(nproc) || IGNORE_ERRORS=m make -j1 V=s

    - name: Organize files
      run: |
        cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800.manifest ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800.manifest
        cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800-squashfs-factory.img ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-factory.img
        cp ./openwrt-r7800/bin/targets/ipq806x/generic/openwrt-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin ./openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin
        tar -zcvf kmods-openwrt-24.10.6-NSS-${{ env.OPENWRT_DEVICE_MODEL }}.tar.gz \
          -C ./openwrt-r7800/bin/targets/ipq806x/generic/packages \
          $(find ./openwrt-r7800/bin/targets/ipq806x/generic/packages -name 'kmod-*.ipk' -printf '%P\n')

    - name: Generate release Release Tag
      id: snapshottag
      run: |
        echo "release_tag=24.10.6-nss-release_$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT

    - name: Upload release firmware to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.snapshottag.outputs.release_tag }}-${{ env.OPENWRT_DEVICE_MODEL }}
        files: |
          openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800.manifest
          openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-factory.img
          openwrt-24.10.6-NSS-ipq806x-generic-netgear_r7800-squashfs-sysupgrade.bin
          kmods-openwrt-24.10.6-NSS-${{ env.OPENWRT_DEVICE_MODEL }}.tar.gz

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 2
